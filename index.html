<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASIO CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator">
        <div class="header">
            <h2>CASIO<span>.</span></h2>
            <p>SMART CALCULATOR</p>
        </div>
        <div class="screen">
            <div id="previous"></div>
            <input type="text" id="display" value="0" readonly>
        </div>
        <div class="buttons">

            <button class="special" onclick="clearCalculator()">AC</button>
            <button class="special" onclick="deleteNumber()">DEL</button>
            <button class="special" onclick="percentage()">%</button>
            <button class="operator" onclick="setOperator('/')">÷</button>

            <button onclick="pressNumber('7')">7</button>
            <button onclick="pressNumber('8')">8</button>
            <button onclick="pressNumber('9')">9</button>
            <button class="operator" onclick="setOperator('*')">×</button>

            <button onclick="pressNumber('4')">4</button>
            <button onclick="pressNumber('5')">5</button>
            <button onclick="pressNumber('6')">6</button>
            <button class="operator" onclick="setOperator('-')">−</button>

            <button onclick="pressNumber('1')">1</button>
            <button onclick="pressNumber('2')">2</button>
            <button onclick="pressNumber('3')">3</button>
            <button class="operator" onclick="setOperator('+')">+</button>

            <button class="special" onclick="changeSign()">±</button>
            <button onclick="pressNumber('0')">0</button>
            <button onclick="decimal()">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
        <div class="footer">
            <span>✦</span> Designed with precision
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
