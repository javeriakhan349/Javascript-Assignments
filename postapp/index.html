
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIT Post App</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f4f4;
        }

        .loginForm,
        .signupForm {
            max-width: 450px;
            margin: 60px auto;
        }

        .bgImg {
            width: 100px;
            height: 80px;
            object-fit: cover;
            cursor: pointer;
            border: 3px solid transparent;
            border-radius: 8px;
        }

        .bgImg.selected {
            border: 3px solid #0d6efd;
        }

        .post-card {
            overflow: hidden;
            border-radius: 12px;
        }

        .post-card .card-body {
            background-size: cover;
            background-position: center;
            min-height: 180px;
        }

        .post-content {
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 8px;
            padding: 15px;
        }
    </style>

</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold" href="#">
                SIT POST APP
            </a>

            <div>

                <button class="btn btn-outline-dark mx-1"
                    type="button" onclick="showLogin()">
                    Log In
                </button>

                <button class="btn btn-dark mx-1"
                    type="button" onclick="showSignup()">
                    Sign Up
                </button>

                <button class="btn btn-danger mx-1 d-none"
                    type="button" id="logoutBtn" onclick="logout()">
                    Logout
                </button>

            </div>

        </div>

    </nav>


    <!-- LOGIN FORM -->
    <div class="loginForm" id="loginForm">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">Log In</h2>

            <form id="login-box" onsubmit="login(event)">

                <div class="mb-3">

                    <label class="form-label">Email Address</label>

                    <input type="email"
                        class="form-control"
                        id="login-email"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Password</label>

                    <input type="password"
                        class="form-control"
                        id="login-password"
                        placeholder="Enter your password"
                        required>

                </div>

                <button type="submit" class="btn btn-dark w-100">
                    Log In
                </button>

            </form>

            <p class="text-center mt-3 mb-0">

                Don't have an account?

                <a href="#" onclick="showSignup(); return false;">
                    Sign Up
                </a>

            </p>

        </div>

    </div>


    <!-- SIGNUP FORM -->
    <div class="signupForm d-none" id="signupForm">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">Create Account</h2>

            <form id="signup" onsubmit="signup(event)">

                <div class="mb-3">

                    <label class="form-label">Full Name</label>

                    <input type="text"
                        class="form-control"
                        id="signup-name"
                        placeholder="Enter your name"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Email Address</label>

                    <input type="email"
                        class="form-control"
                        id="signup-email"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Password</label>

                    <input type="password"
                        class="form-control"
                        id="signup-password"
                        placeholder="Create password"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Confirm Password</label>

                    <input type="password"
                        class="form-control"
                        id="confirm-password"
                        placeholder="Confirm password"
                        required>

                </div>

                <div class="form-check mb-3">

                    <input type="checkbox"
                        class="form-check-input"
                        id="terms"
                        required>

                    <label class="form-check-label" for="terms">
                        I agree to the terms and conditions
                    </label>

                </div>

                <button type="submit" class="btn btn-dark w-100">
                    Sign Up
                </button>

            </form>

            <p class="text-center mt-3 mb-0">

                Already have an account?

                <a href="#" onclick="showLogin(); return false;">
                    Log In
                </a>

            </p>

        </div>

    </div>


    <!-- POST PAGE -->
    <div class="postpage d-none" id="postPage">

        <div class="container py-5">

            <h2 class="text-center mb-4">
                Create Your Post
            </h2>

            <!-- POST INPUTS -->
            <div class="card shadow p-4 mb-5">

                <div class="mb-3">

                    <label class="form-label">Post Title</label>

                    <input type="text"
                        id="title"
                        class="form-control"
                        placeholder="Enter post title">

                </div>

                <div class="mb-3">

                    <label class="form-label">Description</label>

                    <textarea id="desc"
                        class="form-control"
                        rows="4"
                        placeholder="Write your description"></textarea>

                </div>

                <h5>Select Background Image</h5>

                <div class="d-flex gap-3 mb-4 flex-wrap">

                    <img src="https://picsum.photos/id/1015/400/300"
                        class="bgImg selected"
                        onclick="selectImg(this)">

                    <img src="https://picsum.photos/id/1018/400/300"
                        class="bgImg"
                        onclick="selectImg(this)">

                    <img src="https://picsum.photos/id/1025/400/300"
                        class="bgImg"
                        onclick="selectImg(this)">

                </div>

                <button class="btn btn-primary"
                    id="createBtn"
                    type="button"
                    onclick="post()">

                    Create Post

                </button>

            </div>


            <!-- DISPLAY POSTS -->
            <h2 class="mb-4">Your Posts</h2>

            <div class="row" id="postContainer"></div>

        </div>

    </div>


    <!-- SWEET ALERT -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- YOUR JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
