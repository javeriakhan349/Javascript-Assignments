<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  </head>
  <body>
    <div class="container">
        <h1 class="text-center">Javascript Quiz</h1>
        <div class="card p-4" id="quizContainer">
            <p class="fw-bold">Q1. Which method is used to select an HTML element by its ID?</p>
            <label class="my-2 border-primary-subtle border-bottom "><input type="radio" name="option" value="getElementsByTagName()" class="me-3"> getElementsByTagName()</label>

            <label class="my-2 border-primary-subtle border-bottom "><input type="radio" name="option" value="querySelectorAll()" class="me-3"> querySelectorAll()</label>

            <label class="my-2 border-primary-subtle border-bottom "><input type="radio" name="option" value="getElementById()" class="me-3"> getElementById()</label>

            <label class="my-2 border-primary-subtle border-bottom "><input type="radio" name="option" value="getElementsByClassName()" class="me-3"> getElementsByClassName()</label>

            <button class="btn btn-success mx-auto w-25 my-2 ">NEXT</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
    <script src="app.js"></script>
  </body>
</html>
